name: Update OpencodeContract

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-opencode-contract
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      changed: ${{ steps.revisions.outputs.changed }}
      old_rev: ${{ steps.revisions.outputs.old_rev }}
      new_rev: ${{ steps.revisions.outputs.new_rev }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_lock: ${{ steps.candidate.outputs.candidate_lock }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
      audit_summary: ${{ steps.audit.outputs.summary }}
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Update OpencodeContract must be dispatched from refs/heads/main; got $DISPATCH_REF" >&2
            exit 1
          fi

      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Test lock hygiene checker
        run: python3 -m unittest discover -s tests -p 'test_opencode_contract_lock_update.py' -v

      - name: Record and update OpencodeContract revision
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          cp flake.lock "$RUNNER_TEMP/flake.lock.before"

          read_revision() {
            python3 - "$1" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              lock = json.load(handle)
          locked = lock["nodes"]["opencodeContract"]["locked"]
          expected = {
              "owner": "upiscium",
              "repo": "OpencodeContract",
              "type": "github",
          }
          for field, value in expected.items():
              if locked.get(field) != value:
                  raise SystemExit(f"unexpected OpencodeContract {field}: {locked.get(field)!r}")
          revision = locked.get("rev", "")
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit(f"invalid OpencodeContract revision: {revision!r}")
          print(revision)
          PY
          }

          OLD_REV="$(read_revision "$RUNNER_TEMP/flake.lock.before")"
          nix flake update opencodeContract
          NEW_REV="$(read_revision flake.lock)"

          if cmp -s "$RUNNER_TEMP/flake.lock.before" flake.lock; then
            CHANGED=false
          else
            if [[ "$OLD_REV" == "$NEW_REV" ]]; then
              echo "flake.lock changed without an OpencodeContract revision change" >&2
              exit 1
            fi
            CHANGED=true
          fi
          {
            echo "old_rev=$OLD_REV"
            echo "new_rev=$NEW_REV"
            echo "changed=$CHANGED"
          } >> "$GITHUB_OUTPUT"

      - name: Report no-op update
        if: steps.revisions.outputs.changed == 'false'
        env:
          OLD_REV: ${{ steps.revisions.outputs.old_rev }}
          NEW_REV: ${{ steps.revisions.outputs.new_rev }}
        run: |
          {
            echo "### OpencodeContract update"
            echo
            echo "OpencodeContract is already up to date."
            echo
            printf "Old: \`%s\`\n" "$OLD_REV"
            printf "Current: \`%s\`\n" "$NEW_REV"
            echo
            echo "No branch, commit, push, or pull request was created."
          } >> "$GITHUB_STEP_SUMMARY"
          cmp -s "$RUNNER_TEMP/flake.lock.before" flake.lock

      - name: Require flake.lock-only candidate change
        if: steps.revisions.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test "$(git status --short)" = " M flake.lock"

      - name: Validate lock hygiene
        if: steps.revisions.outputs.changed == 'true'
        run: |
          python3 tools/check_opencode_contract_lock_update.py \
            "$RUNNER_TEMP/flake.lock.before" \
            flake.lock

      - name: Run Python contracts
        if: steps.revisions.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests -v

      - name: Check generated template drift
        if: steps.revisions.outputs.changed == 'true'
        run: python3 tools/render_templates.py check

      - name: Evaluate supported systems
        if: steps.revisions.outputs.changed == 'true'
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Build explicit contract check
        if: steps.revisions.outputs.changed == 'true'
        run: nix build .#checks.x86_64-linux.opencode-contract --no-link --no-update-lock-file

      - name: Validate contract
        if: steps.revisions.outputs.changed == 'true'
        run: nix develop --no-update-lock-file .#checks.x86_64-linux.opencode-contract --command opencode-contract validate

      - name: Audit Agent Core consumer strictly
        if: steps.revisions.outputs.changed == 'true'
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file .#checks.x86_64-linux.opencode-contract --command \
            opencode-contract audit-consumer \
              --profile agent-core \
              --consumer . \
              --strict | tee "$RUNNER_TEMP/contract-audit.log"
          SUMMARY="$(grep '^SUMMARY ' "$RUNNER_TEMP/contract-audit.log")"
          [[ "$SUMMARY" == *"DIFF=0"* ]]
          [[ "$SUMMARY" == *"MISSING=0"* ]]
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Verify template distribution contract
        if: steps.revisions.outputs.changed == 'true'
        run: nix develop --no-update-lock-file --command just template::distribution-verify

      - name: Recheck candidate scope after validation
        if: steps.revisions.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test "$(git status --short)" = " M flake.lock"

      - name: Export validated candidate
        if: steps.revisions.outputs.changed == 'true'
        id: candidate
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          import hashlib
          from pathlib import Path

          content = Path("flake.lock").read_bytes()
          print("candidate_lock=" + base64.b64encode(content).decode("ascii"))
          print("candidate_sha256=" + hashlib.sha256(content).hexdigest())
          PY

  publish:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Restore trusted main and validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          OLD_REV: ${{ needs.validate.outputs.old_rev }}
          NEW_REV: ${{ needs.validate.outputs.new_rev }}
          CANDIDATE_LOCK: ${{ needs.validate.outputs.candidate_lock }}
          CANDIDATE_SHA256: ${{ needs.validate.outputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config --local core.hooksPath /dev/null
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git checkout --detach FETCH_HEAD

          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          content = base64.b64decode(os.environ["CANDIDATE_LOCK"], validate=True)
          digest = hashlib.sha256(content).hexdigest()
          if digest != os.environ["CANDIDATE_SHA256"]:
              raise SystemExit("validated candidate checksum mismatch")
          Path(os.environ["RUNNER_TEMP"], "flake.lock.candidate").write_bytes(content)
          PY
          python3 tools/check_opencode_contract_lock_update.py \
            flake.lock \
            "$RUNNER_TEMP/flake.lock.candidate"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def revision(path: Path) -> str:
            return json.loads(path.read_text(encoding="utf-8"))["nodes"]["opencodeContract"]["locked"]["rev"]

          old_revision = revision(Path("flake.lock"))
          new_revision = revision(Path(os.environ["RUNNER_TEMP"], "flake.lock.candidate"))
          if old_revision != os.environ["OLD_REV"]:
              raise SystemExit("trusted main OpencodeContract revision changed after validation")
          if new_revision != os.environ["NEW_REV"]:
              raise SystemExit("candidate OpencodeContract revision changed after validation")
          Path("flake.lock").write_bytes(
              Path(os.environ["RUNNER_TEMP"], "flake.lock.candidate").read_bytes()
          )
          PY
          test "$(git status --short)" = " M flake.lock"

      - name: Check duplicate branch and pull request
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          NEW_REV: ${{ needs.validate.outputs.new_rev }}
          CANDIDATE_SHA256: ${{ needs.validate.outputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_REV="${NEW_REV:0:12}"
          BRANCH="chore/opencode-contract-${SHORT_REV}"
          PR_JSON="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "$BRANCH" \
              --json url,headRepositoryOwner
          )"
          mapfile -t OPEN_PRS < <(
            PR_JSON="$PR_JSON" python3 - <<'PY'
          import json
          import os

          for pull_request in json.loads(os.environ["PR_JSON"]):
              owner = pull_request.get("headRepositoryOwner") or {}
              if owner.get("login") == os.environ["GITHUB_REPOSITORY_OWNER"]:
                  print(pull_request["url"])
          PY
          )
          if (( ${#OPEN_PRS[@]} > 1 )); then
            echo "multiple open pull requests exist for $BRANCH" >&2
            exit 1
          fi
          EXISTING_PR="${OPEN_PRS[0]:-}"
          if [[ -n "$EXISTING_PR" ]]; then
            git fetch --no-tags origin \
              "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git show "$BASE_SHA:flake.lock" > "$RUNNER_TEMP/flake.lock.base"
            git show "refs/remotes/origin/$BRANCH:flake.lock" \
              > "$RUNNER_TEMP/flake.lock.branch"
            mapfile -d '' -t CHANGED_PATHS < <(
              git diff --name-only -z "$BASE_SHA" "refs/remotes/origin/$BRANCH"
            )
            CHECK_ARGS=(
              python3 tools/check_opencode_contract_lock_update.py
              "$RUNNER_TEMP/flake.lock.base"
              "$RUNNER_TEMP/flake.lock.branch"
              --candidate "$RUNNER_TEMP/flake.lock.candidate"
              --candidate-sha256 "$CANDIDATE_SHA256"
              --expected-revision "$NEW_REV"
            )
            for path in "${CHANGED_PATHS[@]}"; do
              CHECK_ARGS+=(--changed-path "$path")
            done
            "${CHECK_ARGS[@]}"
          else
            set +e
            git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null
            REMOTE_STATUS=$?
            set -e
            if [[ "$REMOTE_STATUS" -eq 0 ]]; then
              echo "remote branch exists without an open pull request: $BRANCH" >&2
              exit 1
            fi
            if [[ "$REMOTE_STATUS" -ne 2 ]]; then
              echo "cannot determine whether remote branch exists: $BRANCH" >&2
              exit 1
            fi
          fi
          {
            echo "short_rev=$SHORT_REV"
            echo "branch=$BRANCH"
            echo "existing_pr=$EXISTING_PR"
          } >> "$GITHUB_OUTPUT"

      - name: Report existing pull request
        if: steps.duplicate.outputs.existing_pr != ''
        env:
          OLD_REV: ${{ needs.validate.outputs.old_rev }}
          NEW_REV: ${{ needs.validate.outputs.new_rev }}
          BRANCH: ${{ steps.duplicate.outputs.branch }}
          PR_URL: ${{ steps.duplicate.outputs.existing_pr }}
        run: |
          {
            echo "### OpencodeContract update"
            echo
            printf "Old: \`%s\`\n" "$OLD_REV"
            printf "New: \`%s\`\n" "$NEW_REV"
            printf "Branch: \`%s\`\n" "$BRANCH"
            echo "Draft PR: $PR_URL"
            echo "Validation: PASS"
            echo
            echo "An open pull request already exists; no branch, commit, push, or new pull request was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push validated lock update
        if: steps.duplicate.outputs.existing_pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.duplicate.outputs.branch }}
          SHORT_REV: ${{ steps.duplicate.outputs.short_rev }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- flake.lock
          test "$(git diff --cached --name-only)" = "flake.lock"
          git commit -m "chore: update OpencodeContract to $SHORT_REV"
          git push origin HEAD:"$BRANCH"

      - name: Create Draft pull request
        if: steps.duplicate.outputs.existing_pr == ''
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_REV: ${{ needs.validate.outputs.old_rev }}
          NEW_REV: ${{ needs.validate.outputs.new_rev }}
          BRANCH: ${{ steps.duplicate.outputs.branch }}
          SHORT_REV: ${{ steps.duplicate.outputs.short_rev }}
          AUDIT_SUMMARY: ${{ needs.validate.outputs.audit_summary }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pull-request.md" <<EOF
          ## 概要
          - OpencodeContractを$OLD_REVから$NEW_REVへ更新

          ## Lock hygiene
          - nixpkgs unchanged
          - flake-utils unchanged
          - root inputs unchanged
          - only opencodeContract-exclusive lock subtree changed
          - update target = opencodeContract

          ## Contract audit
          - profile = agent-core
          - strict audit: $AUDIT_SUMMARY
          - DIFF=0
          - MISSING=0

          ## Templates contract
          - Python contract tests PASS
          - generated drift PASS
          - distribution verify PASS

          ## Verification
          - nix flake check --all-systems --no-build --no-update-lock-file
          - explicit contract check build
          - opencode-contract validate
          - strict agent-core audit

          ## Scope
          - flake.lock only
          - Agent Core source unchanged
          - generated templates unchanged
          - adapters unchanged

          ## Non-goals
          - Agent Core behavior changes
          - model assignment changes
          - template regeneration
          - automatic merge
          EOF
          PR_URL="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "chore: update OpencodeContract to $SHORT_REV" \
              --body-file "$RUNNER_TEMP/pull-request.md"
          )"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Report created Draft pull request
        if: steps.duplicate.outputs.existing_pr == ''
        env:
          OLD_REV: ${{ needs.validate.outputs.old_rev }}
          NEW_REV: ${{ needs.validate.outputs.new_rev }}
          BRANCH: ${{ steps.duplicate.outputs.branch }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          {
            echo "### OpencodeContract update"
            echo
            printf "Old: \`%s\`\n" "$OLD_REV"
            printf "New: \`%s\`\n" "$NEW_REV"
            printf "Branch: \`%s\`\n" "$BRANCH"
            echo "Draft PR: $PR_URL"
            echo "Validation: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
